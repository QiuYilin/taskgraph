name: vcpkg-windows-2025

on:
  push:
    branches: [ "main","feature_git_action_vcpkg" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.config.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        config:
        - os: windows-2025
          vcpkg_triplet: x64-windows

    steps:
    - uses: actions/checkout@v4                                
    - name: vcpkg install
      uses: johnwason/vcpkg-action@v8
      id: vcpkg
      with:
        triplet: ${{ matrix.config.vcpkg_triplet }}
        cache-key: ${{ matrix.config.os }}
        revision: 817892b0ecbc6af994dd6df999c73faf795adbf2
        token: ${{ github.token }}
        manifest-dir: ${{ github.workspace }}/.github/manifest
        extra-args: --x-feature=ui --x-feature=examples
        collect-logs: on-failure
        fetch-depth: 0
    - name: configure cmake
      run: |
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 18 2026" -A x64 -T host=x64 -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.config.vcpkg_triplet }}
    - name: cmake build
      run: cmake --build ${{github.workspace}}/build --config Release